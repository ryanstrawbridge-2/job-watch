name: Check job boards
on:
  schedule:
    - cron: '30 15 * * *'   # 7:30 AM Seattle (PST), 8:30 AM PDT
    - cron: '30 0 * * *'    # 4:30 PM Seattle (PST), 5:30 PM PDT
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check boards
        run: python3 watch.py
      - name: Save results
        run: |
          git config user.name "job-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json docs/jobs.json docs/summary.txt
          git diff --cached --quiet || git commit -m "Update jobs $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push
