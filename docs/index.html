<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Watch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f2ee;--card:#fff;--fg:#1b1f23;--muted:#5e6670;--faint:#8a929b;--line:#e2ded7;--line2:#d3cec5;
  --link:#0a58b8;--accent:#0a66c2;--on:#0f6b45;--onFg:#fff;--pill:#fff;--pillLine:#b9b3a8;
  --energy:#2f7d4f;--energyBg:#e3f1e8;--aero:#2f5fa7;--aeroBg:#e4ecf8;--other:#6a5f50;--otherBg:#efebe4;
  --intern:#7a3fa0;--internBg:#f1e7f8;--entry:#0f6b45;--entryBg:#e2f2ea;--mid:#8a5a00;--midBg:#f8eed9;
  --new:#c2410c;--star:#c98a00;--shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line);--scrim:rgba(20,20,20,.42);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--card:#1a1e23;--fg:#e8eaed;--muted:#a3abb4;--faint:#7c858f;--line:#2a2f36;--line2:#363c44;
  --link:#79b0ff;--accent:#4d97f0;--on:#3fb27f;--onFg:#08140e;--pill:#1a1e23;--pillLine:#4a515a;
  --energy:#6fd39a;--energyBg:#1c3327;--aero:#8db6ff;--aeroBg:#1c2a42;--other:#c9bca8;--otherBg:#2c2822;
  --intern:#d1a3f0;--internBg:#33243f;--entry:#6fd39a;--entryBg:#1c3327;--mid:#f0c060;--midBg:#3a2f17;
  --new:#ff8a50;--star:#f5c542;--shadow:0 0 0 1px var(--line);--scrim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 0 0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
h1{font-size:24px;letter-spacing:-.01em;margin:0}
.upd{border:0;background:none;color:var(--muted);font-size:12.5px;padding:6px 0 6px 8px;display:flex;align-items:center;gap:5px}
.searchbox{position:relative;margin:8px 0 0}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
input[type=search]{width:100%;padding:9px 36px 9px 36px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px;-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{display:none}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.clearq{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);padding:8px;display:none}
.clearq.show{display:block}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 10px;margin:0 -16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--pillLine);background:var(--pill);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--fg);white-space:nowrap}
.pill.on{background:var(--on);border-color:var(--on);color:var(--onFg)}
.pill .ic.sm{margin-right:-2px}
.pill .badge{background:var(--onFg);color:var(--on);border-radius:999px;font-size:12px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.pill.icon-only{padding:6px 10px}
.hdrline{border-bottom:1px solid var(--line)}

/* content */
main{padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 6px;color:var(--muted);font-size:13.5px}
.bar b{color:var(--fg);font-weight:600}
.link{border:0;background:none;color:var(--link);font-weight:600;padding:4px 0;font-size:13.5px}
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:11px 14px;margin:6px 0 4px;font-size:14px}
.banner .dot{width:9px;height:9px;border-radius:50%;background:var(--new);flex:none}
.banner span{flex:1}
.banner .ic{color:var(--faint)}
.grp{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 2px 8px;display:flex;gap:6px}
.grp .n{font-weight:500;color:var(--faint)}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.card{position:relative;display:flex;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:12px 8px 12px 12px}
.logo{flex:none;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--otherBg);color:var(--other)}
.logo.energy{background:var(--energyBg);color:var(--energy)}
.logo.aero{background:var(--aeroBg);color:var(--aero)}
.cbody{flex:1;min-width:0}
.title{color:var(--link);font-weight:650;font-size:15.5px;line-height:1.3;text-decoration:none;display:block}
.title::after{content:"";position:absolute;inset:0;border-radius:12px}
.card.seen .title{color:var(--muted)}
.co{font-size:14px;margin-top:2px;color:var(--fg)}
.loc{font-size:13.5px;color:var(--muted);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:6px;background:var(--otherBg);color:var(--other)}
.tag.intern{background:var(--internBg);color:var(--intern)}
.tag.entry{background:var(--entryBg);color:var(--entry)}
.tag.mid{background:var(--midBg);color:var(--mid)}
.tag.energy{background:var(--energyBg);color:var(--energy)}
.tag.aero{background:var(--aeroBg);color:var(--aero)}
.tag.new{background:var(--new);color:#fff}
.found{font-size:12.5px;color:var(--faint);margin-top:6px}
.found .newtxt{color:var(--new);font-weight:650}
.acts{display:flex;flex-direction:column;gap:0;flex:none;position:relative;z-index:1;margin:-4px 0}
.act{border:0;background:none;color:var(--faint);width:40px;height:40px;display:grid;place-items:center;border-radius:8px}
.act:active{background:var(--bg)}
.act.on{color:var(--star)}
.act.on .ic{fill:currentColor}
.empty{color:var(--muted);text-align:center;padding:40px 12px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.more{display:block;width:100%;margin:14px 0;padding:12px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--fg);font-weight:600}
details.box{background:var(--card);box-shadow:var(--shadow);border-radius:12px;margin:8px 0;padding:0 14px}
details.box summary{list-style:none;padding:12px 0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
details.box summary::-webkit-details-marker{display:none}
details.box summary .ic{margin-left:auto;color:var(--faint);transition:transform .15s}
details.box[open] summary .ic{transform:rotate(90deg)}
.plist{list-style:none;margin:0;padding:0 0 6px}
.plist li{padding:9px 0;border-top:1px solid var(--line)}
.plist a{color:var(--link);font-weight:600;text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warn{color:var(--mid)}
footer{margin:26px 2px 0;font-size:12.5px;color:var(--faint);line-height:1.5}

/* segmented */
.seg{display:flex;background:var(--line);border-radius:9px;padding:2px;margin:10px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* list rows for companies / news */
.rows{list-style:none;margin:0;padding:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.rows li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .rb{flex:1;min-width:0}
.rows a{color:var(--link);font-weight:600;text-decoration:none}
.go{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 0 calc(env(safe-area-inset-bottom) + 2px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;font-size:11px;font-weight:600;color:var(--faint);position:relative}
nav.tabs button.on{color:var(--fg)}
nav.tabs .ic{width:23px;height:23px}
nav.tabs .cnt{position:absolute;top:1px;left:calc(50% + 7px);background:var(--new);color:#fff;font-size:10.5px;border-radius:999px;min-width:17px;height:17px;line-height:17px;padding:0 4px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--card);border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 2px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h3{margin:0;font-size:17px}
.sheet .x{border:0;background:none;padding:6px;color:var(--muted)}
.sheet .sb{overflow-y:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.sheet .sf{display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}
.sheet .sf button{flex:1;border-radius:999px;padding:12px;font-weight:700;font-size:15px}
.btn2{border:1px solid var(--line2);background:var(--card)}
.btn1{border:0;background:var(--accent);color:#fff}
.fs h4{font-size:15px;margin:16px 0 4px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.opt:last-child{border-bottom:0}
.opt .lbl{flex:1}
.opt .cnt{color:var(--faint);font-size:13.5px}
.mark{flex:none;width:22px;height:22px;border:2px solid var(--pillLine);display:grid;place-items:center;color:transparent}
.mark.radio{border-radius:50%}
.mark.box{border-radius:6px}
.opt.sel .mark{border-color:var(--on);background:var(--on);color:var(--onFg)}
.opt.sel .mark.radio{background:none;box-shadow:inset 0 0 0 4px var(--card);background:var(--on)}
.opt.sel .mark.radio .ic{display:none}
.coSearch{width:100%;margin:8px 0 2px;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--fg);font-size:16px}
.showall{border:0;background:none;color:var(--link);font-weight:600;padding:10px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,20px);background:#22262b;color:#fff;padding:10px 10px 10px 16px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#8fc1ff;font-weight:700;padding:4px 6px}
@media (min-width:700px){.card{padding:14px 10px 14px 14px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9.5 6a15 15 0 0 1-2.7 3.2M6.5 7.6C4.5 8.9 3.1 10.8 2.5 12c1 1.5 4.5 6 9.5 6 1.5 0 2.9-.4 4.1-1"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12C3.5 10.5 7 6 12 6s8.5 4.5 9.5 6c-1 1.5-4.5 6-9.5 6s-8.5-4.5-9.5-6z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M5 4h12a1 1 0 0 1 1 1v14a1 1 0 0 0 1 1H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M18 9h2v9a2 2 0 0 1-2 2M8 8h6M8 12h6M8 16h4"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v15M14 9h5a1 1 0 0 1 1 1v10M2 20h20M8 8h2M8 12h2M8 16h2M17 13h0M17 16h0"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 4v3h3M4 13a8 8 0 0 0 14.5 4.5M20 20v-3h-3"/></symbol>
</svg>

<header>
  <div class="wrap">
    <div class="top"><h1 id="h1">Jobs</h1><button class="upd" id="upd" aria-label="Reload"><span id="updt">Loading…</span><svg class="ic sm"><use href="#i-refresh"/></svg></button></div>
    <div class="searchbox"><svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="q" placeholder="Search title, company, city" autocomplete="off" enterkeyhint="search">
      <button class="clearq" id="clearq" aria-label="Clear search"><svg class="ic sm"><use href="#i-x"/></svg></button></div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="hdrline"></div>
</header>
<main><div class="wrap" id="list"><p class="empty">Loading…</p></div></main>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div class="sh"><h3 id="shTitle"></h3><button class="x" data-sheet="close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="sb" id="shBody"></div>
  <div class="sf"><button class="btn2" data-sheet="reset">Reset</button><button class="btn1" data-sheet="apply" id="shApply">Show results</button></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
const $ = (id) => document.getElementById(id);
const icon = (n, cls = '') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('jw.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jw.' + k, JSON.stringify(v)); } catch (e) {} },
};
const pt = (ms) => new Date(ms).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const today = () => pt(Date.now());
const daysAgo = (n) => pt(Date.now() - n * 864e5);

const SECT = { energy: 'Energy', aero: 'Aero & space', other: 'Other engineering' };
const SECT_SHORT = { energy: 'Energy', aero: 'Aero & space', other: 'Other' };
const LEVEL = { intern: 'Internship / co-op', entry: 'Entry level', mid: 'Mid level (II)', none: 'Level not stated' };
const LEVEL_TAG = { intern: 'Internship', entry: 'Entry level', mid: 'Mid level' };
const DATES = [['any', 'Any time'], ['visit', 'Since my last visit'], ['0', 'Found today'], ['3', 'Past 3 days'], ['7', 'Past week'], ['30', 'Past month']];
const MILES = [[10, 'Within 10 mi'], [25, 'Within 25 mi'], [50, 'Within 50 mi']];
const SORTS = [['new', 'Newest first'], ['near', 'Closest to Seattle'], ['sector', 'Energy & aero first']];
const DEFAULTS = { date: 'any', levels: [], sectors: [], disc: [], miles: 50, companies: [], sort: 'new', unknown: true };
// type of engineering, from the title (a role can be more than one)
const DISC = [
  ['mech', 'Mechanical & design', /mechanic|mechanism|thermal|fluid|propulsion|tooling|valve|hvac|piping|packaging|product design|design engineer|turbo|structures? (design|engineer)|cad\b|engine\b/i],
  ['elec', 'Electrical & electronics', /electric|electronic|avionics|\bpower\b|\brf\b|pcb|harness|\bemc\b|silicon|analog|asic|fpga|hardware|grid|substation|scada|protection|instrument/i],
  ['mfg', 'Manufacturing & quality', /manufactur|production|process|industrial|automation|quality|supplier|reliability|weld|additive|machin|composite|\bnc\b|operational excellence|materials/i],
  ['test', 'Test & integration', /test|integration|validation|verification|commissioning|\blab\b|\bi&t\b|\bai&t\b/i],
  ['sys', 'Systems, GNC & controls', /systems? engineer|\bgnc\b|guidance|navigation|mission|controls?\b|robotic|mechatronic/i],
  ['civil', 'Civil, structural & construction', /civil|structural|geotech|transportation|water|environmental|construction|project engineer|field engineer|bridge|land develop|building|\beit\b|in training|fire protection|traffic|rail/i],
];
const discOf = (j) => (j._disc ??= DISC.filter((d) => d[2].test(j.title)).map((d) => d[0]).concat([]).filter(Boolean));

let data = null;
let tab = store.get('tab', 'jobs');
if (!['jobs', 'saved', 'news', 'companies'].includes(tab)) tab = 'jobs';
let F = Object.assign({}, DEFAULTS, store.get('filters2', {}));
let saved = new Set(store.get('saved', []));
let hidden = new Set(store.get('hidden', []));
// Hiding also remembers company + title, so the same role stays gone when it is reposted
// under a new id or shows up again from another source.
let hiddenKeys = new Set(store.get('hiddenKeys', []));
const normT = (t) => t.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const hidKey = (j) => (normT(j.company).split(' ')[0] || '') + '|' + normT(j.title);
const isHid = (j) => hidden.has(j.id) || hiddenKeys.has(hidKey(j));
const saveHidden = () => { store.set('hidden', [...hidden]); store.set('hiddenKeys', [...hiddenKeys]); };
let viewed = new Set(store.get('viewed', []));
let savedSeg = 'saved', coSector = 'all', limit = 60;
let draft = null, sheetKind = null, coQuery = '', coAll = false;

// "New" = ids that weren't there the last time you opened the app
let known = null;          // Set of ids from earlier visits (null on the very first visit)
let lastOpen = 0;
// A visit is a stretch of use with no gap over an hour. "New" compares against the previous visit,
// so reopening or reloading the app a few minutes later keeps the same New badges.
function rollVisit() {
  const cur = store.get('visitCur', null), now = Date.now();
  let prev = store.get('visitPrev', null);

  if (!coAll && !q) names = [...draft.companies, ...names.filter((n) => !draft.companies.includes(n))].slice(0, Math.max(10, draft.companies.length));
  return `<input class="coSearch" id="coSearch" type="search" placeholder="Find a company" value="${esc(coQuery)}" autocomplete="off">` +
    (names.map((n) => optRow(`data-tog="companies" data-v="${esc(n)}"`, draft.companies.includes(n), esc(coName(n)), c[n] || 0, 'box')).join('') || '<p class="note">No company by that name has open roles.</p>') +
    (!coAll && !q && total > names.length ? `<button class="showall" data-coall="1">Show all ${total} companies</button>` : '');
}
function secSort() { return SORTS.map(([k, l]) => optRow(`data-set="sort" data-v="${k}"`, draft.sort === k, l, null, 'radio')).join(''); }
const SHEETS = {
  all: ['All filters', () => `<div class="fs"><h4>Sort by</h4>${secSort()}<h4>Date found</h4>${secDate()}<h4>Experience level</h4>${secLevels()}<h4>Engineering type</h4>${secDisc()}<h4>Industry</h4>${secSectors()}<h4>Distance</h4>${secMiles()}<h4>Company</h4>${secCompanies()}</div>`],
  date: ['Date found', secDate], levels: ['Experience level', secLevels], sectors: ['Industry', secSectors], disc: ['Engineering type', secDisc],
  miles: ['Distance from Seattle', secMiles], companies: ['Company', secCompanies], sort: ['Sort by', secSort],
};
function drawSheet(keepScroll) {
  const sb = $('shBody'), top = sb.scrollTop;
  const fo = document.activeElement && document.activeElement.id === 'coSearch';
  const sel = fo ? document.activeElement.selectionStart : 0;
  $('shTitle').textContent = SHEETS[sheetKind][0];
  sb.innerHTML = SHEETS[sheetKind][1]();
  const n = collapse(data.jobs.filter((j) => passes(j, draft) && matchQ(j, qWords()))).length;
  $('shApply').textContent = `Show ${n.toLocaleString()} result${n === 1 ? '' : 's'}`;
  if (keepScroll) sb.scrollTop = top;
  if (fo) { const el = $('coSearch'); el.focus(); el.setSelectionRange(sel, sel); }
}
function openSheet(kind) {
  sheetKind = kind; draft = JSON.parse(JSON.stringify(F)); coQuery = ''; coAll = false;
  drawSheet(); $('shBody').scrollTop = 0;
  $('scrim').classList.add('show'); $('sheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('scrim').classList.remove('show'); $('sheet').classList.remove('show');
  document.body.style.overflow = ''; sheetKind = null;
}
function commit(f) { F = f; store.set('filters2', F); limit = 60; render(); window.scrollTo(0, 0); }

$('sheet').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sheet === 'close') return closeSheet();
  if (b.dataset.sheet === 'apply') { commit(draft); return closeSheet(); }
  if (b.dataset.sheet === 'reset') {
    const keep = sheetKind === 'all' ? {} : { date: draft.date, levels: draft.levels, sectors: draft.sectors, disc: draft.disc, miles: draft.miles, unknown: draft.unknown, companies: draft.companies, sort: draft.sort };
    const reset = { date: ['date'], levels: ['levels'], sectors: ['sectors'], disc: ['disc'], miles: ['miles', 'unknown'], companies: ['companies'], sort: ['sort'] }[sheetKind];
    if (reset) for (const k of reset) delete keep[k];
    draft = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), keep);
    return drawSheet(true);
  }
  if (b.dataset.coall) { coAll = true; return drawSheet(true); }
  const v = b.dataset.v;
  if (b.dataset.set) { draft[b.dataset.set] = b.dataset.set === 'miles' ? +v : v; }
  else if (b.dataset.tog) { const a = draft[b.dataset.tog]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); }
  else if (b.dataset.flip) { draft[b.dataset.flip] = !draft[b.dataset.flip]; }
  else return;
  // single-choice sheets apply right away, like LinkedIn
  if (b.dataset.set && sheetKind !== 'all') { commit(draft); return closeSheet(); }
  drawSheet(true);
});
$('sheet').addEventListener('input', (e) => { if (e.target.id === 'coSearch') { coQuery = e.target.value; drawSheet(true); } });
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetKind) closeSheet(); });
// swipe the sheet down to close
(() => {
  let y0 = null;
  $('sheet').addEventListener('touchstart', (e) => { if (e.target.closest('.sb') && $('shBody').scrollTop > 0) return; y0 = e.touches[0].clientY; }, { passive: true });
  $('sheet').addEventListener('touchmove', (e) => { if (y0 == null) return; const d = e.touches[0].clientY - y0; if (d > 0) $('sheet').style.transform = `translateY(${d}px)`; }, { passive: true });
  $('sheet').addEventListener('touchend', (e) => { if (y0 == null) return; const d = e.changedTouches[0].clientY - y0; $('sheet').style.transform = ''; y0 = null; if (d > 90) closeSheet(); });
})();

// ---------- toast ----------
let toastTimer = null, undoFn = null;
function toast(msg, undo) {
  $('toastMsg').textContent = msg; undoFn = undo;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}
$('toastUndo').addEventListener('click', () => { if (undoFn) undoFn(); $('toast').classList.remove('show'); });

// ---------- events ----------
$('pills').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) return openSheet(b.dataset.open);
  if (b.dataset.quick) {
    const want = b.dataset.quick === 'intern' ? ['intern'] : ['intern', 'entry'];
    const same = F.levels.length === want.length && want.every((x) => F.levels.includes(x));
    return commit(Object.assign({}, F, { levels: same ? [] : want }));
  }
  if (b.dataset.cos) { coSector = b.dataset.cos; render(); }
});
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (tab === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  tab = b.dataset.tab; store.set('tab', tab); $('q').value = ''; limit = 60; render(); window.scrollTo(0, 0);
});
$('q').addEventListener('input', () => { limit = 60; render(); });
$('clearq').addEventListener('click', () => { $('q').value = ''; limit = 60; render(); $('q').focus(); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
$('upd').addEventListener('click', () => load(true));
$('list').addEventListener('click', (e) => {
  const a = e.target.closest('a.title');
  if (a) { const c = a.closest('.card'); viewed.add(c.dataset.id); store.set('viewed', [...viewed].slice(-3000)); setTimeout(() => { c.classList.add('seen'); }, 400); return; }
  if (e.target.id === 'more') { limit += 60; render(); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.clear) { $('q').value = ''; return commit(Object.assign({}, DEFAULTS)); }
  if (b.dataset.open) return openSheet(b.dataset.open);
  if (b.dataset.date) return commit(Object.assign({}, F, { date: b.dataset.date }));
  if (b.dataset.seg) { savedSeg = b.dataset.seg; return render(); }
  if (b.dataset.co) { tab = 'jobs'; store.set('tab', tab); $('q').value = ''; return commit(Object.assign({}, DEFAULTS, { companies: [b.dataset.co] })); }
  if (b.dataset.act) {
    const id = b.closest('.card').dataset.id;
    if (b.dataset.act === 'save') {
      saved.has(id) ? saved.delete(id) : saved.add(id); store.set('saved', [...saved]);
      if (tab === 'saved') render(); else {
        const on = saved.has(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
        b.setAttribute('aria-label', on ? 'Unsave' : 'Save');
        if (on) toast('Saved');
      }
    } else {
      const card = b.closest('.card');
      const ids = (card.dataset.ids || id).split(' ');
      const grp = data.jobs.filter((j) => ids.includes(j.id));
      const was = grp.some(isHid);
      const keys = grp.map(hidKey);
      const apply = (hide) => {
        for (const x of ids) hide ? hidden.add(x) : hidden.delete(x);
        for (const k of keys) hide ? hiddenKeys.add(k) : hiddenKeys.delete(k);
        saveHidden();
      };
      const redraw = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
      apply(!was);
      card.style.display = 'none';
      redraw();
      toast(was ? 'Back in your list' : 'Hidden', () => { apply(was); redraw(); });
    }
  }
});

let loadedAt = 0;
async function load(manual) {
  if (manual) $('updt').textContent = 'Checking…';
  try {
    const r = await fetch('jobs.json?t=' + Date.now(), { cache: 'no-store' });
    const fresh = await r.json();
    const first = !data;
    data = fresh;
    // a new "visit" starts on first load, or after the app sat in the background for an hour
    rollVisit();
    // older versions saved only ids; carry those over to company + title
    let mig = false;
    for (const j of data.jobs) if (hidden.has(j.id) && !hiddenKeys.has(hidKey(j))) { hiddenKeys.add(hidKey(j)); mig = true; }
    if (mig) saveHidden();
    loadedAt = Date.now();
    const u = new Date(data.updated);
    $('updt').textContent = 'Updated ' + u.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    render();
  } catch (e) {
    $('updt').textContent = 'Offline';
    if (!data) $('list').innerHTML = '<div class="empty"><b>Couldn\'t load the job list</b>Check your connection and reopen the app.</div>';
  }
}
render();
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
